server {

    server_name wpsync.dev www.wpsync.dev;

    root /var/www/wpsync;
    index index.php index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }

    location = /blog {
        return 301 /blog/;
    }

    location /blog/ {
        try_files $uri $uri/ /blog/index.php?$query_string;
    }

    location ^~ /vendor/ {
        return 404;
    }

    location ~ ^/(composer\.(json|lock)|nginx\.conf)$ {
        return 404;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/wpsync.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wpsync.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;

    server_name wpsync.dev www.wpsync.dev;
    return 301 https://$host$request_uri;
}
